name: sthamly-worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only one worker run at a time. A running job is never cancelled by a new one.
concurrency:
  group: sthamly-worker
  cancel-in-progress: false

jobs:
  run-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LLAMA_CPP_DIR: ${{ github.workspace }}/llama.cpp
      LLAMA_CPP_CONVERTER: ${{ github.workspace }}/llama.cpp/convert_hf_to_gguf.py
      LLAMA_QUANTIZE: ${{ github.workspace }}/llama.cpp/build/bin/llama-quantize
      LLAMA_IMATRIX: ${{ github.workspace }}/llama.cpp/build/bin/llama-imatrix
      LLAMA_PERPLEXITY: ${{ github.workspace }}/llama.cpp/build/bin/llama-perplexity
      WORKER_MIN_FREE_GB: '8'
      IMATRIX_THREADS: '2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Build llama.cpp at the pinned commit
        env:
          LLAMA_CPP_REF: ${{ vars.LLAMA_CPP_REF }}
        run: |
          if [ -z "$LLAMA_CPP_REF" ]; then
            echo "Repo variable LLAMA_CPP_REF is not set. Set it to a commit you have verified."
            exit 1
          fi
          git clone https://github.com/ggerganov/llama.cpp "$LLAMA_CPP_DIR"
          cd "$LLAMA_CPP_DIR"
          git checkout "$LLAMA_CPP_REF"
          pip install -r requirements/requirements-convert_hf_to_gguf.txt
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j2 --target llama-quantize llama-imatrix llama-perplexity

      - name: Process one queued job
        run: python scripts/worker.py --once