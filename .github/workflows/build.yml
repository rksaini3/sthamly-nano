name: build-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-desk.txt pyinstaller
      - name: Build exe
        run: pyinstaller --onefile --name SthamlyDesk --hidden-import pypdf --hidden-import keyring --add-data "desk/desk_config.json;." desk/sthamly_desk.py
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/SthamlyDesk.exe
