name: ci

on:
  push:
  pull_request:

# Read-only token: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Uses the lockfile when it is committed; falls back to npm install until it is.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (lib/*.test.ts)
        run: npm test
      # Builds with NO Supabase env on purpose: the site must degrade gracefully, not crash.
      - name: Build
        run: npm run build

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      # worker.py and the tests import huggingface_hub, so the runtime deps must be installed.
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile scripts/*.py desk/*.py
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v